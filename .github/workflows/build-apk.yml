name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug -PGIT_SHA=${{ github.sha }}

      - name: Rename APK with Commit SHA
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/InOut-alpha-${SHORT_SHA}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InOut-Debug-APK
          path: app/build/outputs/apk/debug/InOut-alpha-*.apk

      - name: Publish Rolling Alpha Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: rolling-alpha
          name: "InOut Alpha Rolling (${{ github.sha }})"
          body: |
            Automated rolling alpha build from commit `${{ github.sha }}`.
          files: app/build/outputs/apk/debug/InOut-alpha-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Build InOut APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug -Pandroid.useAndroidX=true -Pandroid.nonTransitiveRClass=true --no-daemon --stacktrace

      - name: Rename APK with Commit SHA
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          cp app/build/outputs/apk/debug/*.apk InOut-alpha-${SHORT_SHA}.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InOut-v1.0-Debug
          path: InOut-alpha-*.apk

      - name: Publish Rolling Alpha Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: alpha-latest
          name: "InOut Alpha"
          body: "BUILD_SHA:${{ github.sha }}"
          prerelease: true
          files: InOut-alpha-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          

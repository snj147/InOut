name: Build InOut APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.6'
          cache-disabled: true

      - name: Build Debug APK
        run: gradle assembleDebug -Pandroid.useAndroidX=true -Pandroid.nonTransitiveRClass=true --no-daemon --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InOut-v1.0-Debug
          path: app/build/outputs/apk/debug/*.apk

      - name: Recreate Rolling Release
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete existing release and tag so assets are guaranteed fresh
          gh release delete alpha-latest --yes || true
          git tag -d alpha-latest || true
          git push origin :refs/tags/alpha-latest || true

          # Create fresh release with short SHA
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          gh release create alpha-latest \
            app/build/outputs/apk/debug/*.apk \
            --title "InOut Alpha ($SHORT_SHA)" \
            --notes "BUILD_SHA:${{ github.sha }}" \
            --prerelease

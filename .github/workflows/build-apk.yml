name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle 8.8
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.8'

      - name: Build Debug APK
        run: gradle assembleDebug -PGIT_SHA=${{ github.sha }}

      - name: Rename APK with Commit SHA
        run: |
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          APK_PATH=$(find . -name "app-debug.apk" | head -n 1)
          if [ -n "$APK_PATH" ]; then
            DIR=$(dirname "$APK_PATH")
            mv "$APK_PATH" "$DIR/InOut-alpha-${SHORT_SHA}.apk"
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: InOut-Debug-APK
          path: "**/InOut-alpha-*.apk"
          retention-days: 1

      - name: Publish Rolling Alpha Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: rolling-alpha
          name: "InOut Alpha Rolling (${{ github.sha }})"
          body: |
            Automated continuous alpha build from commit `${{ github.sha }}`.
          files: "**/InOut-alpha-*.apk"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
